<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FGIR 细粒度标注与独立复核</title>
<style>
body{font:15px system-ui;margin:0;background:#f2f4f7;color:#15222f}header{padding:22px 28px;background:#142a3b;color:white}main{padding:20px;max-width:1500px;margin:auto}section{background:white;padding:18px;border-radius:10px;margin-bottom:16px}label{display:inline-block;margin:7px 14px 7px 0}label:has(textarea){display:block;width:100%;margin:14px 0}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #a9b7c3;border-radius:5px}textarea{display:block;box-sizing:border-box;width:100%;min-height:76px}button{cursor:pointer;background:#e8f0fa;margin:3px}small{color:#546775}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.tile{border:3px solid #d7dee5;border-radius:8px;padding:7px;overflow:hidden}.tile img{width:100%;height:155px;object-fit:contain;background:#f4f4f4}.tile.positive{border-color:#16875c}.tile.negative{border-color:#b76c51}.tile p{font-size:11px;word-break:break-all}.bar{position:sticky;top:0;background:#fff;padding:10px;z-index:2;border-bottom:1px solid #ddd}#message{white-space:pre-wrap}.hint{color:#9b411d}#source img{max-height:160px}#precheck{background:#fff7df;padding:12px}h1{font-size:24px;margin:0 0 8px}h2{font-size:18px}
</style>
<header><h1>细粒度查询：标注与独立复核</h1><div>真实图库 · 本地离线 · 初稿不能作为正式评测标注</div></header>
<main><section><p>逐张看图后标记相关/不相关。未看图片保留“未审”，不要当作负样本。全图库标注须覆盖全部候选；候选池须说明构建方式，并在 E0/E1/E2 的共同结果池上复核。源图配对和自动类别只是初稿。</p>
<p>每人初标25条；A/B互审，C/D互审。独立复核必须由另一人实际执行，姓名字段不能代替独立检查。</p>
<button id="export">导出全部 JSONL</button><label>导入工作文件 <input id="import" type="file" accept=".jsonl,.json"></label><span id="message"></span></section>
<section><label>分配 <select id="member"><option value="">全部</option><option>A</option><option>B</option><option>C</option><option>D</option></select></label><label>查询 <select id="query"></select></label><span id="status"></span>
<div id="source"></div><p id="precheck" hidden></p><label>查询文本<textarea id="text"></textarea></label><div id="categories"></div>
<label>标注人 <input id="annotator"></label><label>独立复核人 <input id="reviewer"></label><label>范围 <select id="scope"><option value="candidate_pool">候选池</option><option value="full_gallery">全图库</option></select></label>
<label>候选池构建方法<textarea id="pool"></textarea></label><label>标注说明<textarea id="notes"></textarea></label><label>复核记录/争议处理<textarea id="review"></textarea></label>
<button id="draft">保存为初稿</button><button id="annotated">保存初标</button><button id="reviewed">记录已独立复核</button><p class="hint">保存后仍需点击“导出全部 JSONL”。本页面不上传数据，也不保证浏览器重启后保留记录。</p></section>
<div class="bar"><label>图片范围 <select id="view"><option value="all">全部图库</option><option value="pool">当前候选池</option><option value="unjudged-pool">候选池未审</option></select></label><label>图片ID筛选 <input id="filter"></label><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button><button id="negative-page">将本页未审图片标为不相关（须已逐图检查）</button><span id="coverage"></span></div>
<section><div id="gallery" class="grid"></div></section></main>
<script id="data" type="application/json">__FGIR_DATA__</script>
<script>
const payload=JSON.parse(document.querySelector('#data').textContent),gallery=payload.gallery;
let rows=payload.queries,current=0,page=0;const $=id=>document.getElementById(id);
function message(value){$('message').textContent=value}
function row(){return rows[current]}
function options(){const member=$('member').value;const select=$('query');select.replaceChildren();rows.forEach((r,i)=>{if(!member||r.assigned_to===member){const o=document.createElement('option');o.value=i;o.textContent=`${r.query_id} [${r.assigned_to}] ${r.primary_category||r.categories.join('/')}`;select.append(o)}});if(![...select.options].some(o=>Number(o.value)===current))current=Number(select.value);select.value=current;load()}
function load(){const r=row();if(!r)return;page=0;$('text').value=r.text;$('annotator').value=r.annotator||'';$('reviewer').value=r.reviewer||'';$('scope').value=r.annotation_scope;$('pool').value=r.pool_method||'';$('notes').value=r.annotation_notes||'';$('review').value=r.review_notes||'';$('status').textContent=`${r.annotation_status}；计划复核：${r.planned_reviewer||'未指定'}`;$('precheck').hidden=!r.pre_review;$('precheck').textContent=r.pre_review?`预审意见（仍待初标与独立复核）：${r.pre_review.notes}`:'';$('categories').replaceChildren();for(const category of ['color','count','action','relation']){const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.value=category;check.checked=r.categories.includes(category);label.append(check,category);$('categories').append(label)}$('source').replaceChildren();const source=gallery.find(x=>x.image_id===r.source_image_id);if(source){const img=document.createElement('img');img.src=source.thumbnail;img.alt=source.image_id;$('source').append(img)}render()}
function visible(){const filter=$('filter').value.trim().toLowerCase(),r=row(),view=$('view').value,pool=new Set(r.pool_candidate_image_ids||[...r.judged_image_ids,...r.relevant_image_ids]);return gallery.filter(x=>x.image_id.toLowerCase().includes(filter)&&(view==='all'||pool.has(x.image_id)&&(view==='pool'||!r.judged_image_ids.includes(x.image_id))))}
function render(){const r=row(),filtered=visible(),pages=Math.max(1,Math.ceil(filtered.length/40));page=Math.max(0,Math.min(page,pages-1));$('page').textContent=`${page+1}/${pages}`;$('gallery').replaceChildren();for(const item of filtered.slice(page*40,(page+1)*40)){const judged=r.judged_image_ids.includes(item.image_id),positive=r.relevant_image_ids.includes(item.image_id);const tile=document.createElement('div');tile.className='tile'+(judged?(positive?' positive':' negative'):'');const img=document.createElement('img');img.src=item.thumbnail;img.alt=item.image_id;const p=document.createElement('p');p.textContent=item.image_id;tile.append(img,p);for(const [label,value] of [['相关','positive'],['不相关','negative'],['未审','unknown']]){const button=document.createElement('button');button.textContent=label;button.onclick=()=>{r.judged_image_ids=r.judged_image_ids.filter(x=>x!==item.image_id);r.relevant_image_ids=r.relevant_image_ids.filter(x=>x!==item.image_id);if(value!=='unknown')r.judged_image_ids.push(item.image_id);if(value==='positive')r.relevant_image_ids.push(item.image_id);r.annotation_status='draft';render()};tile.append(button)}$('gallery').append(tile)}$('coverage').textContent=`已审 ${r.judged_image_ids.length}/${gallery.length}；相关 ${r.relevant_image_ids.length}`}
function save(status){const r=row();r.text=$('text').value.trim();r.categories=[...$('categories').querySelectorAll('input:checked')].map(x=>x.value);r.annotator=$('annotator').value.trim()||null;r.reviewer=$('reviewer').value.trim()||null;r.annotation_scope=$('scope').value;r.pool_method=$('pool').value.trim();r.annotation_notes=$('notes').value.trim();r.review_notes=$('review').value.trim();if(status!=='draft'&&(!r.annotator||!r.text||!r.categories.length||!r.relevant_image_ids.length||r.relevant_image_ids.some(id=>!r.judged_image_ids.includes(id))))return message('需填写标注人、文本、类别和已看图确认的相关图片。');if(status==='reviewed'&&(!r.reviewer||r.reviewer===r.annotator||!r.review_notes))return message('需另一位真实复核人及复核说明。');if(status==='reviewed'&&r.annotation_scope==='full_gallery'&&r.judged_image_ids.length!==gallery.length)return message('全图库模式必须逐图覆盖全部候选。');if(status==='reviewed'&&r.annotation_scope==='candidate_pool'&&!r.pool_method)return message('请记录候选池构建方法。');if(status==='reviewed'&&r.annotation_scope==='candidate_pool'&&(r.pool_candidate_image_ids||[]).some(id=>!r.judged_image_ids.includes(id)))return message('候选池仍有未审图片，请先完成全部候选池审图。');r.annotation_status=status;$('status').textContent=status;message('已存入当前页面内存；请导出 JSONL。')}
$('member').onchange=options;$('query').onchange=()=>{current=Number($('query').value);load()};$('filter').oninput=()=>{page=0;render()};$('view').onchange=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('draft').onclick=()=>save('draft');$('annotated').onclick=()=>save('annotated');$('reviewed').onclick=()=>save('reviewed');$('negative-page').onclick=()=>{const r=row();for(const x of visible().slice(page*40,(page+1)*40))if(!r.judged_image_ids.includes(x.image_id)){r.judged_image_ids.push(x.image_id);r.relevant_image_ids=r.relevant_image_ids.filter(id=>id!==x.image_id)}r.annotation_status='draft';render()};
$('export').onclick=()=>{const blob=new Blob([rows.map(x=>JSON.stringify(x)).join('\n')+'\n'],{type:'application/x-ndjson'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='annotations.work.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onchange=async()=>{try{const parsed=(await $('import').files[0].text()).split(/\r?\n/).filter(x=>x.trim()).map(x=>JSON.parse(x));const ids=new Set(rows.map(x=>x.query_id));if(parsed.length!==rows.length||new Set(parsed.map(x=>x.query_id)).size!==rows.length||parsed.some(x=>!ids.has(x.query_id)))throw Error('查询集合不一致');for(const x of parsed)if(!Array.isArray(x.categories)||!Array.isArray(x.judged_image_ids)||!Array.isArray(x.relevant_image_ids))throw Error('格式错误');rows=parsed;options();message('已导入；导出前请用 Python validate-annotations 完整校验。')}catch(error){message('导入失败：'+error.message)}};options();
</script></html>
