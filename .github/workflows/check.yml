name: core-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[data]"
      - run: python -m unittest discover -s tests -v
      - run: python -m fgir search --index examples/index.json --query-vector examples/query_vector.json --top-k 3
      - run: python -m fgir evaluate --rankings examples/rankings.json --qrels examples/qrels.json
