name: D demo package
on:
  workflow_dispatch:
  push:
    branches: [main, feat/d-retrieval-app]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build-demo-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: fgir-d-demo-windows
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.whl
          if-no-files-found: error
