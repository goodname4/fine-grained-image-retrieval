[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fine-grained-image-retrieval"
version = "0.2.0"
description = "Local image retrieval coursework: reproducible data, annotation and evaluation tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["Pillow>=10"]
model = ["numpy>=2", "torch>=2.6", "transformers>=4.45", "Pillow>=10"]
demo = ["numpy>=2", "torch>=2.6", "transformers>=4.45,<5", "Pillow>=10", "streamlit>=1.40"]
training = ["numpy>=2", "torch>=2.6"]
semantic-training = ["numpy>=2", "torch>=2.6", "transformers>=4.45,<5", "Pillow>=10"]

[project.scripts]
fgir = "fgir.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fgir = ["*.html"]
